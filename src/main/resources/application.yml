server:
  port: 8081
  servlet:
    context-path: /collector
  error:
    include-stacktrace: never

spring:
  application:
    name: yoursummoner-collector
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/yoursummoner_collector}
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-null-for-primitives: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

riot:
  api:
    # Nunca chamar de riot.api.key: a env RIOT_API_KEY mapearia direto e vazaria para os testes
    token: ${RIOT_API_KEY:}
    base-url-template: https://{host}.api.riotgames.com
    connect-timeout: 2s
    read-timeout: 6s

collector:
  enabled: true
  master-key: ${YOURSUMMONER_MASTER_KEY:}
  vault:
    database: yoursummoner
  yoursummoner-api-url: http://localhost:8080/your-summoner
  budget-fraction: 0.6
  retention-patches: 3
  max-matches-per-patch: 15000
  seed-cron: "0 0 */6 * * *"
  platforms: BR1,NA1,LA1,LA2,EUW1,EUN1,TR1,RU,ME1,KR,JP1,OC1,SG2,TW2,VN2

logging:
  level:
    com.your.summoner.collector: INFO
